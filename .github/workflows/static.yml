name: Deploy static content to Pages

on:
  push:
    branches: ['master']

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      # 走 docs 自己的 build 脚本：gen:llms + 5 个微应用 + vitepress build。
      # 此前这里手写三条 vite build，漏了 vue2 与 react-legacy，也没跑 gen:llms，
      # 于是线上 micro-apps/vue2/、micro-apps/react-legacy/、llms.txt 全是 404
      # —— 而 PlaygroundHost 在这两个框架下各有 42 处页面引用，示例页全打不开。
      # 加微应用请改 docs/package.json 的 build:micro，别再在这里手写。
      - name: Build docs site and micro apps
        run: pnpm -C docs build
        env:
          DEPLOY_BASE: /virt-list/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/.vitepress/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
